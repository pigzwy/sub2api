# =============================================================================
# [FORK] 二开 Docker 镜像构建 & 推送
# =============================================================================
# 手动触发或 push 到 main/cc/gy/request-audit 时自动构建
# main -> <DOCKER_HUB_USERNAME>/sub2api:latest
# cc   -> <DOCKER_HUB_USERNAME>/sub2api:cc
# gy   -> <DOCKER_HUB_USERNAME>/sub2api:gy
# request-audit -> <DOCKER_HUB_USERNAME>/sub2api:request-audit
# =============================================================================

name: "[FORK] Build & Push Docker Image"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 Tag（留空则使用 latest + short commit hash）'
        required: false
        type: string
  push:
    branches:
      - main
      - cc
      - gy
      - request-audit

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/sub2api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Prepare tags
        id: tags
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)

          if [ -n "$INPUT_TAG" ]; then
            # 手动指定 tag
            CUSTOM_TAG="$INPUT_TAG"
            VERSION="${CUSTOM_TAG#v}"
            echo "tags=${{ env.DOCKER_IMAGE }}:${CUSTOM_TAG}" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${{ env.DOCKER_IMAGE }}:${CUSTOM_TAG}" >> "$GITHUB_OUTPUT"
          else
            # 自动使用当前代码能追溯到的最新 v* tag；VERSION 文件只做兜底。
            VERSION=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//' || true)
            if [ -z "$VERSION" ]; then
              VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
            fi

            case "$REF_NAME" in
              main)
                BRANCH_TAG="latest"
                ;;
              cc)
                BRANCH_TAG="cc"
                ;;
              gy)
                BRANCH_TAG="gy"
                ;;
              request-audit)
                BRANCH_TAG="request-audit"
                ;;
              *)
                # workflow_dispatch 可能从其它分支手动运行，统一转成合法 Docker tag。
                BRANCH_TAG=$(echo "$REF_NAME" | tr '/[:upper:]' '-[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')
                ;;
            esac

            echo "tags=${{ env.DOCKER_IMAGE }}:${BRANCH_TAG},${{ env.DOCKER_IMAGE }}:${BRANCH_TAG}-${COMMIT_SHORT},${{ env.DOCKER_IMAGE }}:${BRANCH_TAG}-build-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${{ env.DOCKER_IMAGE }}:${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          fi

          echo "commit=${COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            GOSUMDB=sum.golang.google.cn
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ steps.tags.outputs.commit }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### ✅ Docker 镜像构建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**推送的镜像 Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**部署命令:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.tags.outputs.primary_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker compose up -d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
